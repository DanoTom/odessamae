# ---------------------------------------------------------------------------
# Odessa Mae — configuración del generador de videos (odessa.py)
#
# Todas las rutas son relativas a esta carpeta. Para una tanda nueva de
# canciones alcanza con agregar entradas en [[songs]], poner los MP3 y las
# fotos con los nombres que se indican abajo y sumar las letras al .md.
# ---------------------------------------------------------------------------

[paths]
mp3_dir     = "input/mp3"          # NN-archivo-base.mp3
images_dir  = "input/images"       # foto-NN.png  (blanco y negro)
fonts_dir   = "input/fonts"        # .ttf de Abril Fatface y Libre Baskerville
lyrics_file = "Letras.md"          # acepta bloques **Lyrics** ```text``` o LYRICS … CREDITS
face_model  = "input/models/face_detection_yunet_2023mar.onnx"
output_dir  = "output"
work_dir    = "work"               # caché: transcripciones, alineación, audio normalizado, .ass

[artist]
name = "Odessa Mae"

# ---------------------------------------------------------------------------
# Canciones. single = true genera sencillo con letra + Short.
# compilation = true la incluye en la compilación (en este orden).
# ---------------------------------------------------------------------------
